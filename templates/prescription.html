{% extends "base.html" %}
{% block title %}Prescription — TMS{% endblock %}

{% block content %}
<!-- ── Topbar ──────────────────────────────────────────────────────────────── -->
<div class="topbar">
  <div class="topbar-title">
    <h1>📋 Weekly Prescription</h1>
    <p id="week-label">Loading week…</p>
  </div>
  <div class="topbar-actions">
    <span style="font-size:12px;color:var(--text-secondary);margin-right:8px;">Today is highlighted in blue</span>
  </div>
</div>

<!-- ── Page Content ────────────────────────────────────────────────────────── -->
<div class="page-content">

  <!-- Weekly Grid Card -->
  <div class="card">
    <div class="rx-grid-wrap">
      <table class="rx-grid" id="rx-table">
        <thead>
          <tr>
            <th style="width:90px;"></th>
            <th class="rx-day-header" data-day="monday">
              <span class="day-name">Mon</span>
              <span class="day-date" id="date-monday"></span>
            </th>
            <th class="rx-day-header" data-day="tuesday">
              <span class="day-name">Tue</span>
              <span class="day-date" id="date-tuesday"></span>
            </th>
            <th class="rx-day-header" data-day="wednesday">
              <span class="day-name">Wed</span>
              <span class="day-date" id="date-wednesday"></span>
            </th>
            <th class="rx-day-header" data-day="thursday">
              <span class="day-name">Thu</span>
              <span class="day-date" id="date-thursday"></span>
            </th>
            <th class="rx-day-header" data-day="friday">
              <span class="day-name">Fri</span>
              <span class="day-date" id="date-friday"></span>
            </th>
            <th class="rx-day-header" data-day="saturday">
              <span class="day-name">Sat</span>
              <span class="day-date" id="date-saturday"></span>
            </th>
            <th class="rx-day-header" data-day="sunday">
              <span class="day-name">Sun</span>
              <span class="day-date" id="date-sunday"></span>
            </th>
          </tr>
        </thead>
        <tbody id="rx-body">
          <!-- Rows injected by JS -->
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!-- Add-to-Slot Modal                                                         -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<div class="modal-overlay" id="add-slot-modal">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <h2>➕ Add Tablet to Slot</h2>
      <button class="modal-close" onclick="closeModal('add-slot-modal')">✕</button>
    </div>
    <div class="modal-body">

      <div style="margin-bottom:16px;padding:12px;background:var(--bg-primary);border-radius:var(--radius-sm);border:1px solid var(--border);">
        <p style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">Adding to slot:</p>
        <p id="slot-label" style="font-size:14px;font-weight:700;color:var(--accent);"></p>
      </div>

      <div class="form-group" style="margin-bottom:20px;">
        <label for="slot-tablet-select">Select Tablet</label>
        <select id="slot-tablet-select">
          <option value="">— Choose a tablet —</option>
        </select>
      </div>

      <div class="form-actions">
        <button class="btn btn-ghost" onclick="closeModal('add-slot-modal')">Cancel</button>
        <button class="btn btn-primary" id="add-slot-confirm-btn" onclick="confirmAddSlot()">Add to Schedule</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/prescription.js') }}"></script>
{% endblock %}
